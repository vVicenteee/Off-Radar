<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxeo · Ed. 01 — Off Radar</title>
<meta name="description" content="Off Radar — deportes underground, historias reales, sin filtro. Revista digital de talento local.">
<link rel="icon" type="image/png" href="assets/logo-stacked-white.png">
<meta property="og:title" content="Boxeo · Ed. 01 — Off Radar">
<meta property="og:description" content="Off Radar — deportes underground, historias reales, sin filtro. Revista digital de talento local.">
<meta property="og:type" content="website">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<template id="__bundler_thumbnail" data-bg-color="#1D1E1C">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1D1E1C"/>
    <rect x="470" y="210" width="260" height="360" rx="8" fill="#26251F" stroke="#F1841B" stroke-width="6"/>
    <text x="600" y="660" font-family="Archivo,Helvetica,Arial,sans-serif" font-size="70" font-weight="800" fill="#fff" text-anchor="middle">BOXEO</text>
    <text x="600" y="150" font-family="Archivo,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#F1841B" text-anchor="middle">ED. 01</text>
  </svg>
</template>
<helmet data-dc-atomics>
<meta name="design_doc_mode" content="canvas">
<script src="./image-slot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500;1,700&display=swap" rel="stylesheet">
<style>
  html{background:#1D1E1C}
  body{margin:0;background:#1D1E1C;font-family:'Neue Haas Grotesk Display Pro','Neue Haas Grotesk Display','Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#E7569A;text-decoration:none}
  a:hover{color:#ef82b7}
  ::selection{background:#E7569A;color:#1D1E1C}
  .pg a{color:inherit}
  .lbl{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:11px;letter-spacing:.14em;color:#1D1E1C;background:#E7569A;padding:6px 9px;border-radius:5px}
  .sh{margin:0;font-weight:800;font-size:30px;line-height:1;letter-spacing:-.01em;text-transform:uppercase;color:#f5f5f4}
  .card-title{margin:0;font-weight:800;text-transform:uppercase;color:#fff}
  .meta{font-weight:500;font-size:12px;color:rgba(255,255,255,.45)}
  .badge{display:inline-block;font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
  .rail::-webkit-scrollbar{width:8px}
  .rail::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
</style>
<script>
(function(){
  if (window.top !== window.self) return; /* no escalar dentro del editor */
  var DESIGN = 1440;
  function pg(){ return document.querySelector('.pg'); }
  function fit(){
    var el = pg(); if(!el) return;
    el.style.width = DESIGN + 'px';
    el.style.transformOrigin = 'top left';
    var vw = document.documentElement.clientWidth;
    el.style.transform = 'scale(' + (vw / DESIGN) + ')';
    document.body.style.height = el.getBoundingClientRect().height + 'px';
  }
  document.documentElement.style.overflowX = 'hidden';
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  var iv = setInterval(function(){ if(pg()){ fit(); } }, 250);
  setTimeout(function(){ clearInterval(iv); }, 5000);
  if (window.ResizeObserver){
    var t = setInterval(function(){ var el = pg(); if(el){ new ResizeObserver(fit).observe(el); clearInterval(t); } }, 150);
  }
  document.addEventListener('DOMContentLoaded', fit);
  fit();
})();
</script>
</helmet>

<div class="pg" style="display:flex;flex-direction:column;gap:0;background:#1D1E1C;width:100%">
  <dc-import name="OR-Nav" active="ediciones" hint-size="100%,72px"></dc-import>

    <!-- edition header -->
    <div data-screen-label="Ediciones · Flipbook" style="padding:40px 50px 26px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:18px">
      <span class="badge" style="color:#1D1E1C;background:#F1841B;font-size:12px">ED. 01</span>
      <h1 style="margin:0;font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;color:#fff">Boxeo</h1>
      <span class="badge" style="color:#1D1E1C;background:#F1841B">Disponible</span>
      <span style="flex:1"></span>
      <span style="font-weight:600;font-size:13px;color:rgba(255,255,255,.5)">Revista digital · 2026</span>
    </div>

    <!-- flipbook body: 3 columns -->
    <div style="display:grid;grid-template-columns:190px 1fr 250px;gap:0;min-height:640px">

      <!-- LEFT: PÁGINAS thumbnails -->
      <div style="border-right:1px solid rgba(255,255,255,.08);padding:22px 16px;background:#201f1b">
        <div style="font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:16px">Páginas</div>
        <div class="rail" style="display:flex;flex-direction:column;gap:12px;max-height:560px;overflow-y:auto;padding-right:6px">
          <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="8">
            <div onClick="{{ t.pick }}" style="{{ t.wrapStyle }}">
              <div style="{{ t.frameStyle }}">
                <image-slot id="{{ t.thumbId }}" shape="rect" placeholder="{{ t.n }}"></image-slot>
              </div>
              <span style="{{ t.numStyle }}">{{ t.n }}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <!-- CENTER: page viewer -->
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 30px;background:radial-gradient(120% 90% at 50% 0%, rgba(241,132,27,.08), transparent 60%)">
        <div style="position:relative;width:420px;max-width:100%;aspect-ratio:3/4;border-radius:6px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1)">
          <sc-for list="{{ pages }}" as="p" hint-placeholder-count="8">
            <div style="{{ p.pageStyle }}">
              <image-slot id="{{ p.slotId }}" shape="rect" placeholder="{{ p.ph }}"></image-slot>
            </div>
          </sc-for>
          <div style="position:absolute;top:0;left:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35),transparent);pointer-events:none"></div>
        </div>

        <!-- controls -->
        <div style="display:flex;align-items:center;gap:26px;margin-top:26px">
          <span onClick="{{ prev }}" style="{{ prevStyle }}">‹</span>
          <span style="font-weight:700;font-size:14px;letter-spacing:.04em;color:#fff;min-width:130px;text-align:center">{{ counter }}</span>
          <span onClick="{{ next }}" style="{{ nextStyle }}">›</span>
        </div>
        <div style="margin-top:14px;font-weight:600;font-size:13px;color:rgba(255,255,255,.5)">{{ pageLabel }}</div>
      </div>

      <!-- RIGHT: OTRAS EDICIONES -->
      <div style="border-left:1px solid rgba(255,255,255,.08);padding:22px 18px;background:#201f1b">
        <div style="font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:16px">Otras ediciones</div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <sc-for list="{{ others }}" as="o" hint-placeholder-count="3">
            <div style="{{ o.cardStyle }}">
              <div style="aspect-ratio:16/10;position:relative;border-radius:8px;overflow:hidden;margin-bottom:10px"><image-slot id="{{ o.slotId }}" shape="rect" placeholder="{{ o.name }}"></image-slot></div>
              <a href="{{ o.href }}" style="text-decoration:none;display:block">
              <div style="font-weight:700;font-size:11px;letter-spacing:.1em;color:{{ o.color }};margin-bottom:3px">{{ o.ed }}</div>
              <div class="card-title" style="font-size:16px">{{ o.name }}</div>
              <div class="meta" style="margin-top:6px">{{ o.status }} →</div>
              </a>
            </div>
          </sc-for>
        </div>
      </div>

    </div>
  <dc-import name="OR-Footer" hint-size="100%,340px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { page: 0 };
  ACCENT = '#F1841B';
  PAGES = [
    { ph: 'Portada', label: 'Portada' },
    { ph: 'Editorial', label: 'Editorial · carta del director' },
    { ph: 'Índice', label: 'Índice de la edición' },
    { ph: 'Reportaje 1', label: 'Reportaje · Rings de barrio' },
    { ph: 'Reportaje 2', label: 'Reportaje · Rings de barrio' },
    { ph: 'Perfil', label: 'Perfil · Camila Reyes' },
    { ph: 'Galería', label: 'Galería · una noche en el Estrella' },
    { ph: 'Contraportada', label: 'Contraportada' },
  ];
  OTHERS = [
    { ed: 'ED. 02', name: 'Cheerleading', color: '#E7569A', status: 'Próximamente', slotId: 'edx-cheer' },
    { ed: 'ED. 03', name: 'Triatlón', color: '#B9CE0B', status: 'Próximamente', slotId: 'edx-tri' },
    { ed: 'ED. 04', name: 'Fútbol femenino', color: '#584F9C', status: 'Próximamente', slotId: 'edx-fut' },
  ];

  componentDidMount() {
    this._onKey = (e) => {
      if (e.key === 'ArrowRight') this._go(1);
      else if (e.key === 'ArrowLeft') this._go(-1);
    };
    window.addEventListener('keydown', this._onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._onKey); }
  _go(d) { const n = Math.max(0, Math.min(this.PAGES.length - 1, this.state.page + d)); this.setState({ page: n }); }

  renderVals() {
    const cur = this.state.page, N = this.PAGES.length, A = this.ACCENT;
    const SEC = 'Off%20Radar%20-%20Secciones.dc.html';

    const thumbs = this.PAGES.map((p, i) => {
      const active = i === cur;
      return {
        n: String(i + 1),
        thumbId: 'ed1-thumb-' + (i + 1),
        pick: () => this.setState({ page: i }),
        wrapStyle: 'display:flex;align-items:center;gap:10px;cursor:pointer;padding:5px;border-radius:9px;background:' + (active ? 'rgba(241,132,27,.14)' : 'transparent'),
        frameStyle: 'width:52px;height:70px;flex:none;border-radius:5px;overflow:hidden;border:2px solid ' + (active ? A : 'rgba(255,255,255,.14)'),
        numStyle: 'font-weight:800;font-size:13px;color:' + (active ? A : 'rgba(255,255,255,.5)'),
      };
    });

    const pages = this.PAGES.map((p, i) => ({
      slotId: 'ed1-page-' + (i + 1),
      ph: 'Pág. ' + (i + 1) + ' — ' + p.ph,
      pageStyle: 'position:absolute;inset:0;' + (i === cur ? 'opacity:1;z-index:2' : 'opacity:0;z-index:1;pointer-events:none'),
    }));

    const arrowBase = 'width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;user-select:none;';
    const enabled = 'background:#E7569A;color:#1D1E1C;cursor:pointer;';
    const disabled = 'background:#26251F;color:rgba(255,255,255,.25);cursor:default;border:1px solid rgba(255,255,255,.1);';

    const others = this.OTHERS.map(o => ({
      ...o, href: SEC,
      cardStyle: 'display:block;text-decoration:none;padding:12px;border-radius:12px;background:#26251F;border:1px solid ' + o.color + '55',
    }));

    return {
      thumbs, pages, others,
      counter: 'Página ' + (cur + 1) + ' de ' + N,
      pageLabel: this.PAGES[cur].label,
      prev: () => this._go(-1),
      next: () => this._go(1),
      prevStyle: arrowBase + (cur === 0 ? disabled : enabled),
      nextStyle: arrowBase + (cur === N - 1 ? disabled : enabled),
    };
  }
}
</script>
</body>
</html>
