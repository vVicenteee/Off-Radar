<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envía tu historia — Off Radar</title>
<meta name="description" content="Off Radar — deportes underground, historias reales, sin filtro. Revista digital de talento local.">
<link rel="icon" type="image/png" href="assets/logo-stacked-white.png">
<meta property="og:title" content="Envía tu historia — Off Radar">
<meta property="og:description" content="Off Radar — deportes underground, historias reales, sin filtro. Revista digital de talento local.">
<meta property="og:type" content="website">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<template id="__bundler_thumbnail" data-bg-color="#1D1E1C">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1D1E1C"/>
    <path d="M600 240 v190 M520 320 l80 -80 l80 80" fill="none" stroke="#B9CE0B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="440" width="240" height="24" rx="12" fill="#3a3a35"/><text x="600" y="600" font-family="Archivo,Helvetica,Arial,sans-serif" font-size="52" font-weight="800" fill="#fff" text-anchor="middle">ENVÍO</text>
  </svg>
</template>
<helmet data-dc-atomics>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500;1,700&display=swap" rel="stylesheet">
<style>
  html{background:#1D1E1C}
  body{margin:0;background:#1D1E1C;font-family:'Neue Haas Grotesk Display Pro','Neue Haas Grotesk Display','Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#E7569A;text-decoration:none}
  a:hover{color:#ef82b7}
  ::selection{background:#E7569A;color:#1D1E1C}
  .pg a{color:inherit}
  .eyebrow{font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
  .card-title{margin:0;font-weight:800;text-transform:uppercase;color:#fff}
  .field{width:100%;box-sizing:border-box;padding:15px 18px;border-radius:12px;background:#201f1b;border:1px solid rgba(255,255,255,.14);color:#fff;font-family:inherit;font-weight:500;font-size:15px;outline:none}
  .field::placeholder{color:rgba(255,255,255,.35)}
  .field:focus{border-color:#E7569A}
  .flabel{display:block;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:9px}
</style>
<script>
(function(){
  if (window.top !== window.self) return; /* no escalar dentro del editor */
  var DESIGN = 1440;
  function pg(){ return document.querySelector('.pg'); }
  function fit(){
    var el = pg(); if(!el) return;
    el.style.width = DESIGN + 'px';
    el.style.transformOrigin = 'top left';
    var vw = document.documentElement.clientWidth;
    el.style.transform = 'scale(' + (vw / DESIGN) + ')';
    document.body.style.height = el.getBoundingClientRect().height + 'px';
  }
  document.documentElement.style.overflowX = 'hidden';
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  var iv = setInterval(function(){ if(pg()){ fit(); } }, 250);
  setTimeout(function(){ clearInterval(iv); }, 5000);
  if (window.ResizeObserver){
    var t = setInterval(function(){ var el = pg(); if(el){ new ResizeObserver(fit).observe(el); clearInterval(t); } }, 150);
  }
  document.addEventListener('DOMContentLoaded', fit);
  fit();
})();
</script>
</helmet>

<div class="pg" style="display:flex;flex-direction:column;background:#1D1E1C;width:100%">
  <dc-import name="OR-Nav" active="nosotros" hint-size="100%,72px"></dc-import>
  <section data-screen-label="Envío de información" style="position:relative;padding:70px 50px 64px;overflow:hidden">
    <div style="position:absolute;inset:0;background:radial-gradient(90% 120% at 85% 15%, rgba(88,79,156,.5), transparent 55%), radial-gradient(70% 90% at 100% 60%, rgba(231,86,154,.3), transparent 60%);pointer-events:none"></div>
    <div style="position:relative;max-width:760px;margin:0 auto">
      <div style="text-align:center;margin-bottom:38px">
        <span class="eyebrow" style="color:#B9CE0B">Comunidad</span>
        <h1 style="margin:12px 0 14px;font-weight:800;font-size:56px;line-height:.95;text-transform:uppercase;color:#fff">¿Tienes una historia underground?</h1>
        <p style="margin:0;font-weight:400;font-size:18px;line-height:1.55;color:rgba(255,255,255,.65)">Cuéntanosla. Un dato, un tip, un evento o una historia — el radar lo mueve la comunidad.</p>
      </div>
      <sc-if value="{{ envioSent }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center;padding:50px 30px;background:#26251F;border:1px solid rgba(185,206,11,.4);border-radius:18px">
          <div style="width:64px;height:64px;border-radius:50%;background:#B9CE0B;color:#1D1E1C;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 22px">✓</div>
          <h2 class="card-title" style="font-size:30px;margin-bottom:10px">¡Recibido!</h2>
          <p style="margin:0 0 24px;font-weight:400;font-size:16px;color:rgba(255,255,255,.6)">Gracias por poner algo en el radar. Nuestro equipo lo revisará.</p>
          <button onClick="{{ resetEnvio }}" style="padding:13px 26px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:transparent;color:#fff;font-family:inherit;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer">Enviar otra</button>
        </div>
      </sc-if>
      <sc-if value="{{ envioForm }}" hint-placeholder-val="{{ true }}">
        <div style="background:#26251F;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:36px 38px">
          <div style="margin-bottom:20px"><label class="flabel">Título de la historia / dato</label><input class="field" type="text" placeholder="Ej. Ring clandestino en Barrio Histórico" value="{{ evTitle }}" onInput="{{ setEvTitle }}"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
            <div><label class="flabel">Disciplina</label>
              <div style="display:flex;flex-wrap:wrap;gap:8px">
                <sc-for list="{{ envioDiscChips }}" as="d" hint-placeholder-count="4"><span onClick="{{ d.pick }}" style="{{ d.style }}">{{ d.label }}</span></sc-for>
              </div>
            </div>
            <div><label class="flabel">Tu contacto (email)</label><input class="field" type="email" placeholder="tu@correo.cl" value="{{ evEmail }}" onInput="{{ setEvEmail }}"></div>
          </div>
          <div style="margin-bottom:20px"><label class="flabel">Cuéntanos</label><textarea class="field" rows="4" style="resize:vertical" placeholder="¿Qué pasó? ¿Dónde? ¿A quién deberíamos contactar?" value="{{ evMsg }}" onInput="{{ setEvMsg }}"></textarea></div>
          <div style="margin-bottom:24px">
            <label class="flabel">Adjuntar imagen o video <span style="color:rgba(255,255,255,.35);font-weight:500;text-transform:none;letter-spacing:0">(opcional)</span></label>
            <label style="display:flex;align-items:center;gap:14px;padding:22px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.22);background:#201f1b;cursor:pointer">
              <span style="width:44px;height:44px;border-radius:10px;background:rgba(231,86,154,.16);color:#E7569A;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none">↑</span>
              <span style="flex:1"><span style="display:block;font-weight:700;font-size:14px;color:#fff">Arrastra archivos o haz clic para subir</span><span style="display:block;font-weight:500;font-size:12px;color:rgba(255,255,255,.4);margin-top:2px">JPG, PNG, MP4 · hasta 50 MB</span></span>
              <input type="file" multiple accept="image/*,video/*" style="display:none" onChange="{{ onFiles }}">
            </label>
            <sc-if value="{{ hasFiles }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
                <sc-for list="{{ fileList }}" as="f" hint-placeholder-count="1"><span style="display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(185,206,11,.14);border:1px solid rgba(185,206,11,.4);font-weight:600;font-size:12px;color:#c7d94a">◈ {{ f.name }}</span></sc-for>
              </div>
            </sc-if>
          </div>
          <sc-if value="{{ envioError }}" hint-placeholder-val="{{ false }}"><div style="color:#F1841B;font-weight:600;font-size:13px;margin-bottom:14px">Añade al menos un título y cómo contactarte.</div></sc-if>
          <button onClick="{{ submitEnvio }}" style="width:100%;padding:17px;border:none;border-radius:999px;background:#E7569A;color:#1D1E1C;font-family:inherit;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer">Enviar al radar</button>
        </div>
      </sc-if>
    </div>
  </section>
  <dc-import name="OR-Footer" hint-size="100%,340px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { evTitle: '', evEmail: '', evMsg: '', evDisc: '', evFiles: [], evSent: false, evErr: false };
  DISC = [
    { key: 'Boxeo', color: '#F1841B', on: '#1D1E1C' },
    { key: 'Cheerleading', color: '#E7569A', on: '#1D1E1C' },
    { key: 'Triatlón', color: '#B9CE0B', on: '#1D1E1C' },
    { key: 'Fútbol femenino', color: '#584F9C', on: '#fff' },
  ];
  _validEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
  renderVals() {
    const s = this.state;
    const chipBase = 'font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 14px;border-radius:999px;cursor:pointer;border:1px solid ';
    const envioDiscChips = this.DISC.map(d => {
      const active = s.evDisc === d.key;
      const style = active
        ? chipBase + d.color + ';background:' + d.color + ';color:' + d.on
        : chipBase + 'rgba(255,255,255,.16);background:transparent;color:' + d.color;
      return { label: d.key, style, pick: () => this.setState({ evDisc: d.key }) };
    });
    return {
      envioSent: s.evSent, envioForm: !s.evSent, envioError: s.evErr,
      evTitle: s.evTitle, evEmail: s.evEmail, evMsg: s.evMsg, envioDiscChips,
      setEvTitle: e => this.setState({ evTitle: e.target.value }),
      setEvEmail: e => this.setState({ evEmail: e.target.value }),
      setEvMsg: e => this.setState({ evMsg: e.target.value }),
      onFiles: e => this.setState({ evFiles: Array.from(e.target.files || []).map(f => ({ name: f.name })) }),
      hasFiles: s.evFiles.length > 0, fileList: s.evFiles,
      submitEnvio: () => {
        if (!s.evTitle.trim() || !this._validEmail(s.evEmail)) { this.setState({ evErr: true }); return; }
        this.setState({ evSent: true, evErr: false });
      },
      resetEnvio: () => this.setState({ evTitle: '', evEmail: '', evMsg: '', evDisc: '', evFiles: [], evSent: false, evErr: false }),
    };
  }
}
</script>
</body>
</html>
